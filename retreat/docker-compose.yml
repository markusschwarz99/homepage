# Teamretreat-App (rp.markus-schwarz.cc) – eigener Stack, unabhängig vom
# Homepage-Compose. Deploy:  docker compose -f retreat/docker-compose.yml up -d --build
# Lokaler Test (eigene Images/Volume, kein Prod-Impact):
#   RETREAT_PORT=8093 docker compose -p retreat-test -f retreat/docker-compose.yml up -d --build
name: retreat

services:
  retreat-backend:
    build: ./backend
    restart: always
    volumes:
      - retreat_data:/data
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  retreat-frontend:
    build: ./frontend
    restart: always
    ports:
      - "${RETREAT_PORT:-8083}:80"
    depends_on:
      - retreat-backend

volumes:
  retreat_data:
