name: Retreat Tests

on:
  push:
    branches: [main]
    paths:
      - 'retreat/**'
      - '.github/workflows/retreat-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'retreat/**'
      - '.github/workflows/retreat-tests.yml'

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: retreat/backend/requirements*.txt

      - name: Install dependencies
        working-directory: ./retreat/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: ./retreat/backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: retreat/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./retreat/frontend
        run: npm ci

      - name: Type-check
        working-directory: ./retreat/frontend
        run: npx tsc -b --noEmit

      - name: Unit tests
        working-directory: ./retreat/frontend
        run: npm run test

      - name: Build
        working-directory: ./retreat/frontend
        run: npm run build
